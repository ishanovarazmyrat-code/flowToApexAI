<template>
    <lightning-card title="Flow to Apex Converter" icon-name="custom:custom14">
        <div class="slds-p-around_medium">

            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                Enter the API name of an active Record-Triggered Flow. The converter reads its
                metadata, asks Einstein to generate bulk-safe Apex, and creates a new Flow
                Migration record with the result.
            </p>

            <lightning-input
                label="Flow API Name"
                value={flowApiName}
                onchange={handleInputChange}
                placeholder="e.g. Account_Set_Default_Industry"
                disabled={isLoading}
                class="slds-m-bottom_medium">
            </lightning-input>

            <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-button
                    label="Convert to Apex"
                    variant="brand"
                    onclick={handleConvert}
                    disabled={isConvertDisabled}>
                </lightning-button>

                <template lwc:if={isLoading}>
                    <lightning-spinner
                        alternative-text="Converting"
                        size="small"
                        class="slds-m-left_medium">
                    </lightning-spinner>
                    <span class="slds-text-body_small slds-m-left_x-small slds-text-color_weak">
                        Converting — this can take 10 to 30 seconds.
                    </span>
                </template>
            </div>

            <template lwc:if={hasResult}>
                <div class="slds-m-top_large">
                    <template lwc:if={isSuccess}>
                        <div class="result result_success slds-p-around_medium slds-box">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon
                                    icon-name="utility:success"
                                    variant="success"
                                    size="small">
                                </lightning-icon>
                                <span class="slds-text-heading_small slds-m-left_x-small">
                                    Conversion complete
                                </span>
                            </div>
                            <p class="slds-m-top_small">
                                Migration record created for 
                                <span class="slds-m-left_xx-small">

        <strong>{result.flowName}</strong>

    </span>.
                            </p>
 <lightning-tabset class="slds-m-top_medium">
    <lightning-tab label="Trigger">
        <div class="slds-m-bottom_x-small">
            <lightning-button-icon
                icon-name="utility:copy"
                alternative-text="Copy"
                title="Copy Trigger"
                onclick={copyTrigger}>
            </lightning-button-icon>
            <span class="slds-m-left_x-small slds-text-body_small">Copy</span>
        </div>
        <pre class="code-block">{result.triggerCode}</pre>
    </lightning-tab>
    <lightning-tab label="Handler">
        <div class="slds-m-bottom_x-small">
            <lightning-button-icon
                icon-name="utility:copy"
                alternative-text="Copy"
                title="Copy Handler"
                onclick={copyHandler}>
            </lightning-button-icon>
            <span class="slds-m-left_x-small slds-text-body_small">Copy</span>
        </div>
        <pre class="code-block">{result.handlerCode}</pre>
    </lightning-tab>
</lightning-tabset>                           
                            <lightning-button
                                label="Open Migration Record"
                                variant="neutral"
                                onclick={navigateToRecord}
                                class="slds-m-top_small">
                            </lightning-button>
                        </div>
                    </template>

                    <template lwc:else>
                        <div class="result result_error slds-p-around_medium slds-box">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon
                                    icon-name="utility:error"
                                    variant="error"
                                    size="small">
                                </lightning-icon>
                                <span class="slds-text-heading_small slds-m-left_x-small">
                                    Conversion failed
                                </span>
                            </div>
                            <p class="slds-m-top_small">{result.errorMessage}</p>
                            <template lwc:if={result.migrationId}>
                                <lightning-button
                                    label="Open Failure Record"
                                    variant="neutral"
                                    onclick={navigateToRecord}
                                    class="slds-m-top_small">
                                </lightning-button>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
