<template>
    <lightning-card title="Flow to Apex Converter" icon-name="custom:custom14">
        <div class="slds-p-around_medium">

            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                Choose a direction and enter the source name. Einstein reads the source,
                produces the target, and writes the result to a Flow Migration record.
            </p>

            <lightning-radio-group
                name="direction"
                label="Direction"
                options={directionOptions}
                value={direction}
                onchange={handleDirectionChange}
                type="button"
                disabled={isLoading}
                class="slds-m-bottom_medium">
            </lightning-radio-group>

            <lightning-input
                label={inputLabel}
                value={inputName}
                onchange={handleInputChange}
                placeholder={inputPlaceholder}
                disabled={isLoading}
                class="slds-m-bottom_medium">
            </lightning-input>

            <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-button
                    label="Convert"
                    variant="brand"
                    onclick={handleConvert}
                    disabled={isConvertDisabled}>
                </lightning-button>

                <template lwc:if={isLoading}>
                    <lightning-spinner alternative-text="Converting" size="small"
                        class="slds-m-left_medium">
                    </lightning-spinner>
                    <span class="slds-text-body_small slds-m-left_x-small slds-text-color_weak">
                        Converting — this can take 10 to 30 seconds.
                    </span>
                </template>
            </div>

            <template lwc:if={hasResult}>
                <div class="slds-m-top_large">

                    <template lwc:if={isHandlerGenerated}>
                        <div class="result result_success slds-p-around_medium slds-box">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon icon-name="utility:success" variant="success" size="small"></lightning-icon>
                                <span class="slds-text-heading_small slds-m-left_x-small">
                                    Handler generated{objectSuffix}
                                </span>
                            </div>

                            <p class="slds-m-top_small slds-text-body_small">
                                Source: <strong>{result.flowName}</strong>
                            </p>

                            <div class="slds-m-top_small">
                                <lightning-button-icon icon-name="utility:copy" alternative-text="Copy"
                                    title="Copy Handler" onclick={copyHandler}>
                                </lightning-button-icon>
                                <span class="slds-m-left_x-small slds-text-body_small">Copy</span>
                            </div>
                            <pre class="code-block">{result.handlerCode}</pre>

                            <template lwc:if={result.dispatcherHint}>
                                <p class="slds-m-top_small slds-text-body_small">
                                    Add this line to <strong>{result.objectName}TriggerDispatcher.dispatch()</strong>:
                                </p>
                                <pre class="code-block code-block_small">{result.dispatcherHint}</pre>
                            </template>

                            <lightning-button label="Open Migration Record" variant="neutral"
                                onclick={navigateToRecord} class="slds-m-top_small">
                            </lightning-button>
                        </div>
                    </template>

                    <template lwc:if={isFlowGenerated}>
                        <div class="result result_success slds-p-around_medium slds-box">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon icon-name="utility:success" variant="success" size="small"></lightning-icon>
                                <span class="slds-text-heading_small slds-m-left_x-small">
                                    Flow XML generated{objectSuffix}
                                </span>
                            </div>

                            <p class="slds-m-top_small slds-text-body_small">
                                Source: <strong>{result.apexName}</strong>
                            </p>

                            <div class="slds-m-top_small">
                                <lightning-button-icon icon-name="utility:copy" alternative-text="Copy"
                                    title="Copy XML" onclick={copyFlowXml}>
                                </lightning-button-icon>
                                <span class="slds-m-left_x-small slds-text-body_small">Copy</span>
                            </div>
                            <pre class="code-block">{result.flowXml}</pre>

                            <lightning-button label="Open Migration Record" variant="neutral"
                                onclick={navigateToRecord} class="slds-m-top_small">
                            </lightning-button>
                        </div>
                    </template>

                    <template lwc:if={isRefused}>
                        <div class="result result_warning slds-p-around_medium slds-box">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon icon-name="utility:warning" variant="warning" size="small"></lightning-icon>
                                <span class="slds-text-heading_small slds-m-left_x-small">
                                    Not translatable
                                </span>
                            </div>
                            <p class="slds-m-top_small">{result.refusalReason}</p>
                            <lightning-button label="Open Migration Record" variant="neutral"
                                onclick={navigateToRecord} class="slds-m-top_small">
                            </lightning-button>
                        </div>
                    </template>

                    <template lwc:if={isFailed}>
                        <div class="result result_error slds-p-around_medium slds-box">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                                <span class="slds-text-heading_small slds-m-left_x-small">
                                    Conversion failed
                                </span>
                            </div>
                            <p class="slds-m-top_small">{result.errorMessage}</p>
                            <template lwc:if={result.migrationId}>
                                <lightning-button label="Open Failure Record" variant="neutral"
                                    onclick={navigateToRecord} class="slds-m-top_small">
                                </lightning-button>
                            </template>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
